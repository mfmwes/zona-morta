name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ativar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar tipos
        run: pnpm typecheck

      - name: Executar testes
        run: pnpm test

      - name: Validar interface e código
        run: pnpm lint

      - name: Validar build
        run: pnpm build

      - name: Validar sincronização em tempo real
        run: node scripts/check-campaign-live.mjs

      - name: Smoke test do Worker
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="${RUNNER_TEMP}/zona-morta-worker.log"
          HTML_FILE="${RUNNER_TEMP}/zona-morta-home.html"

          pnpm exec wrangler dev --config dist/server/wrangler.json --local --port 8787 >"$LOG_FILE" 2>&1 &
          WORKER_PID=$!

          cleanup() {
            kill "$WORKER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in {1..40}; do
            if curl --fail --silent --show-error --max-time 5               --output "$HTML_FILE" http://127.0.0.1:8787/; then
              READY=1
              break
            fi
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              echo "O Worker encerrou antes de responder."
              cat "$LOG_FILE"
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "O Worker não respondeu com HTTP 2xx dentro do tempo esperado."
            cat "$LOG_FILE"
            exit 1
          fi

          if [ ! -s "$HTML_FILE" ]; then
            echo "A página inicial respondeu sem conteúdo."
            cat "$LOG_FILE"
            exit 1
          fi

          API_STATUS="$(curl --silent --show-error --max-time 5 --output "${RUNNER_TEMP}/zona-morta-api.json"             --write-out "%{http_code}" http://127.0.0.1:8787/api/campaigns || true)"
          if [ -z "$API_STATUS" ] || [ "$API_STATUS" -ge 500 ]; then
            echo "A API principal falhou no runtime local (HTTP ${API_STATUS:-sem resposta})."
            cat "$LOG_FILE"
            exit 1
          fi

          echo "Smoke test concluído: Worker, página inicial e API principal responderam sem erro 5xx."
